<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso mural</title>
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/apple-touch-icon/apple-touch-icon.png">

    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32/favicon-32x32.png">

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16/favicon-16x16.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0ece3;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* CABEÇALHO */
        header {
            width: 100%;
            background-color: #f2d876;
            padding: 15px 0;
            text-align: center;
        }

        header h1 {
            color: #90992c;
            font-size: 24px;
            font-weight: normal;
        }

        /* NAVEGAÇÃO */
        nav {
            width: 100%;
            background-color: #f2d876;
            padding: 12px 0;
            text-align: center;
        }

        nav a {
            color: #2c2c2c;
            margin: 0 18px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
        }

        nav a:hover {
            color: #8b5a2b;
        }

        /* TÍTULO PRINCIPAL */
        .titulo {
            text-align: center;
            font-size: 36px;
            color: #333;
            margin: 40px 0;
        }

        /* FORMULÁRIO */
        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            margin: 0 auto 60px;
        }

        .form-container h2 {
            font-size: 24px;
            color: #444;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 600;
            color: #444;
        }

        input[type="file"],
        select,
        button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background: #f9c80e;
            border: none;
            font-weight: bold;
            color: #222;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #f7b800;
        }

        /* SEÇÕES */
        .section {
            margin: 0 auto 70px;
            max-width: 1200px;
            padding: 0 30px;
        }

        .section h2 {
            font-size: 32px;
            color: #2c2c2c;
            margin-bottom: 25px;
        }

        /* IMAGENS + BOTÃO */
        .galeria {
            display: flex;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        .grid {
            display: flex;
            gap: 25px;
            flex-wrap: nowrap;
        }

        .card {
            width: 250px;
            height: 280px;
            background-color: #c9b89c;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* BOTÃO VER MAIS */
        .ver-mais {
            width: auto;
            min-width: 150px;
            padding: 12px 25px;
            background-color: #8b5a2b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            margin-top: 0;
        }

        .ver-mais:hover {
            background-color: #70471f;
        }

        /* BOTÃO VOLTAR */
        .botao-voltar {
            display: block;
            width: 200px;
            text-align: center;
            margin: 40px auto;
            padding: 12px 25px;
            background: #f9c80e;
            color: #222;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
        }

        .botao-voltar:hover {
            background: #f7b800;
        }
        /*  RESPONSIVIDADE GERAL */

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    margin: 0;
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
}
    </style>
</head>
