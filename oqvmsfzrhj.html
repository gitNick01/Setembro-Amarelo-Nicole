<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f2c94c;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding: 40px 50px;
        }
        .element {
            position: absolute;
        }
        /* Título e texto */
        .titulo {
            top: 40px;
            left: 50px;
            font-size: 72px;
            font-weight: 900;
            color: #222;
            line-height: 1.1;
        }
        .subtexto {
            top: 320px;
            left: 50px;
            font-size: 20px;
            color: #333;
        }
        /* Botões */
        .botoes {
            position: absolute;
            top: 380px;
            left: 50px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 40px;
        }
        .botao {
            width: 220px;
            height: 50px;
            background: rgba(255,255,255,0.85);
            border: none;
            border-radius: 2px;
            font-size: 22px;
            color: #222;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            text-align: center;
        }
        .botao:hover {
            background: rgba(255,255,255,1);
        }
        .img-fundo {
            bottom: 20px;
            right: 0;
            width: 800px;
            height: auto;
            transform: rotate(4deg);
            padding: 8px;
        }
        .botao-voltar {
            position: absolute;
            top: 600px;
            left:0;
            width: 200px;
            text-align: center;
            margin: 50px auto 30px;
            padding: 12px 20px;
            background: #f9c80e;
            color: #222;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .botao-voltar:hover {
            background: #f7b800;
        }
        /*  RESPONSIVIDADE GERAL */

* {
    box-sizing: border-box;
}

</head>
