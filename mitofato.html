<section id="questao-1" style="
  margin-top: 100px;
  padding: 60px 20px;
  background-color: #f2d876;
  font-family: Georgia, 'Times New Roman', serif;
">
  <div style="max-width: 900px; margin: 0 auto; position: relative;">

    <!-- Papel principal -->
    <div style="
      background-color: #f6f0dc;
      padding: 40px 30px;
      position: relative;
      border-radius: 3px;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.15);
      background-image: url('papel-textura.png');
      background-size: cover;
      background-repeat: no-repeat;
    ">

      <!-- Efeito de papel nas laterais -->
      <div style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background-image: url('papel-rasgado.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        opacity: 0.9;
      "></div>

      <!-- Fita amarela -->
      <div style="
        position: absolute;
        top: -15px;
        left: 30px;
        background-color: #f9cd08;
        padding: 10px 25px;
        font-size: 1.5rem;
        font-weight: bold;
        color: #222;
        transform: rotate(-2deg);
        z-index: 2;
      ">
        Questão 1
      </div>

      <!-- Flores -->
      
      <img 
        src="imagens/flor-papel-verde.png"
        alt="Flor-papel-verde" 
        style="
          position: absolute;
          top: 80px;
          left: -200px;
          width: 300px;
          height: auto; 
        "
      >
       <img 
        src="imagens/flor-papel-verde.png"
        alt="Flor-papel-verde" 
        style="
          position: absolute;
          top: -150px;
          right: -150px;
          width: 300px;
          height: auto; 
        "
      >
      <!-- Título -->
      <h2 style="
        text-align: center;
        font-size: 2.5rem;
        color: #222;
        margin: 30px 0 40px 0;
        position: relative;
        z-index: 3;
      ">
        Mito ou Fato?
      </h2>

      <!-- Caixa de pergunta -->
      <div style="
        max-width: 500px;
        margin: 0 auto;
        background-color: #333;
        color: #fff;
        padding: 25px;
        border-radius: 8px;
        position: relative;
        z-index: 3;
      ">
        <p style="
          font-size: 1.1rem;
          line-height: 1.6;
          margin: 0 0 20px 0;
        ">
          Precisamos estar felizes o tempo todo.
        </p>

        <!-- Alternativas -->
        <div style="margin-bottom: 20px;">
          <div style="
            background-color: #444;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
          ">
            Fato
          </div>
          <div style="
            background-color: #444;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
          ">
            Mito
          </div>
        </div>

        <!-- Botão Enviar -->
        <button style="
          width: 100%;
          background-color: #fff;
          color: #222;
          border: none;
          padding: 12px;
          font-size: 1rem;
          font-weight: bold;
          border-radius: 25px;
          cursor: pointer;
        ">
          Enviar
        </button>
      </div>
    </div>
  </div>
</section>
