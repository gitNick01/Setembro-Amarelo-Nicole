<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pausa - Respire e Inspire</title>
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/apple-touch-icon/apple-touch-icon.png">

    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32/favicon-32x32.png">

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16/favicon-16x16.png">


    <style>

        /* CONFIGURAÇÕES GERAIS */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Georgia, serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #fff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        /* CABEÇALHO */
        header {
            background-color: #f2d876;
            padding: 15px 0;
            text-align: center;
        }

        header h1 {
            color: #90992c;
            font-size: 24px;
            font-weight: normal;
        }

        /* NAVEGAÇÃO */

        nav {
            background-color: #f2d876;
            padding: 12px 0;
            text-align: center;
        }

        nav a {
            color: #2c2c2c;
            margin: 0 18px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL */
        .pagina {
            min-height: 780px;
            position: relative;
            overflow: hidden;
            background-color: #fffdf5;
        }

        /* ELEMENTOS DECORATIVOS */
        
        .element {
            position: absolute;
        }

        /* FITAS */
       
        .fita {
            position: absolute;
            background: rgba(210, 180, 140, 0.45);
            height: 30px;
            z-index: 1;
        }

        .fita1 {
            top: 45px;
            left: 30px;
            width: 320px;
            transform: rotate(-3deg);
        }

        /* GIRASSÓIS */
    
        .girassol-topo-dir {
            top: -50px;
            right: -100px;
            width: 400px;
            height: auto;
            z-index: 2;
        }

        .girassol-base-esq {
            top:60%;
            bottom: 20px;
            left: -100px;
            width: 400px;
            height: auto;
            z-index: 2;
        }

        /* TÍTULO PRINCIPAL */
        .titulo-principal {
            top: 65px;
            left: 50px;
            font-size: 32px;
            font-weight: bold;
            color: #2c2c2c;

            background: rgba(255, 255, 255, 0.85);

            padding: 15px 25px;

            border-radius: 3px;

            transform: rotate(-2deg);

            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);

            z-index: 4;
        }

        /* SUBTÍTULO */
        .subtitulo {
            top: 205px;
            left: 70px;

            font-size: 18px;
            color: #333;

            line-height: 1.6;

            z-index: 4;
        }

        /* FRASE GRANDE */

        .frase-grande {
            top: 310px;
            left: 80px;

            font-size: 48px;
            font-weight: 900;

            color: #2c2c2c;

            line-height: 1.2;

            text-transform: uppercase;

            z-index: 4;
        }

        /* CÍRCULO CENTRAL */
    
        .circulo-central {

            top: 220px;

            left: 50%;

            transform: translateX(-50%);

            width: 320px;
            height: 320px;

            background-color: #fff3c0;

            border-radius: 50%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

            padding: 20px;

            z-index: 3;
        }
        
        /* IMAGEM DOS PULMÕES */
       
        .circulo-imagem {

            width: 150px;
            height: 150px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        /* TEXTO DO CÍRCULO */

        .circulo-texto {

            font-size: 16px;

            font-weight: 600;

            color: #333;

            text-transform: uppercase;

            text-align: center;
        }


        .circulo-tempo {

            margin-top: 5px;

            font-size: 14px;

            color: #555;
        }

        /* BLOCO DE PERGUNTAS */
        .bloco-perguntas {

            top: 300px;

            right: 60px;

            width: 220px;

            background: rgba(255, 255, 255, 0.9);

            padding: 25px;

            transform: rotate(3deg);

            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);

            z-index: 4;
        }

        .bloco-perguntas p {

            font-size: 18px;

            line-height: 1.8;

            color: #2c2c2c;
        }

        /* RESPONSIVIDADE */
        
        @media (max-width: 900px) {

            .girassol-topo-esq {
                width: 130px;
            }

            .girassol-topo-dir {
                width: 120px;
            }

            .girassol-base-esq {
                width: 150px;
            }

            .titulo-principal {
                left: 30px;
                font-size: 26px;
            }

            .subtitulo {
                left: 40px;
            }

            .frase-grande {
                left: 40px;
                font-size: 38px;
            }

            .circulo-central {
                width: 280px;
                height: 280px;
            }

            .bloco-perguntas {
                right: 30px;
                width: 190px;
            }

            nav a {
                margin: 0 8px;
                font-size: 15px;
            }
        }


        @media (max-width: 700px) {

            nav {
                padding: 10px;
            }

            nav a {
                display: inline-block;
                margin: 5px 8px;
                font-size: 14px;
            }

            .pagina {
                min-height: 1000px;
            }

            .titulo-principal {
                top: 80px;
                left: 20px;
                font-size: 24px;
            }

            .subtitulo {
                top: 180px;
                left: 25px;
                font-size: 16px;
            }

            .frase-grande {
                top: 260px;
                left: 25px;
                font-size: 36px;
            }

            .circulo-central {
                top: 430px;
                width: 280px;
                height: 280px;
            }

            .bloco-perguntas {
                top: 740px;
                left: 50%;
                right: auto;
                transform: translateX(-50%) rotate(2deg);
                width: 230px;
            }

            .girassol-topo-dir {
                display: none;
            }

            .girassol-base-esq {
                display: none;
            }
        }
        /*  RESPONSIVIDADE GERAL */

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    margin: 0;
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
}

    </style>
</head>


<body>
    <!-- CABEÇALHO -->
    <header>

        <h1>
            Seja bem vindo!
        </h1>

    </header>
    <!-- NAVEGAÇÃO --> 
    <nav>

        <a href="cantinho.html">
            CANTINHO
        </a>

        <a href="pausa.html" style="font-weight: bold; text-decoration: underline;">
            UMA PAUSA
        </a>

        <a href="escrevaeleia.html">
            MENSAGENS
        </a>

        <a href="mural.html">
            NOSSO MURAL
        </a>

        <a href="contato.html">
            ENTRE NÓS
        </a>
        <a href="conscientizacao.html">
            CONSCIENTIZAÇÃO

    </nav>

    <!-- PÁGINA PRINCIPAL -->
    <main class="pagina">

        <div class="fita fita1"></div>

        <div class="fita fita2"></div>
        <img
            src="/imagens/girassol-apagado.png"
            alt="Girassol"
            class="element girassol-topo-dir"
        >

        <img
            src="/imagens/girassol-apagado.png"
            alt="Girassol"
            class="element girassol-base-esq"
        >
        <div class="element titulo-principal">

            Que tal fazer uma pausa?

        </div>
        <div class="element subtitulo">

            Está tudo bem dar uma pausa<br>

            Respire em 3...2...1...

        </div>
        <div class="element frase-grande">

            RESPIRE<br>
            E<br>
            INSPIRE

        </div>
        <!-- CÍRCULO CENTRAL -->
        <div class="element circulo-central">


            <img
                src="/imagens/pulmao.png"
                alt="Desenho de pulmões"
                class="circulo-imagem"
            >


            <div class="circulo-texto">

                RESPIRE E INSPIRE

            </div>


            <div class="circulo-tempo">

                4s

            </div>


        </div>
        <!-- BLOCO DE PERGUNTAS -->

        <div class="element bloco-perguntas">

            <p>

                Se sente:<br>

                sobrecarregado?<br>

                Como se não<br>

                desse conta?<br>

                Com um peso nas<br>

                costas?<br>

                ansioso(a)?

            </p>

        </div>


    </main>


</body>

</html>
